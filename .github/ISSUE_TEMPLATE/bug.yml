name: Bug report
description: Report incorrect compaction, rounding, or package behavior.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime and platform
      description: Include Node.js, browser, Dart or Flutter version and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact amount, currency and allowRounding option.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual results
      description: Include the numeric amount and unit separately.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
